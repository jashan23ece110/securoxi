version: '3.8'

services:
  securoxi-ingress-proxy:
    image: nginx:alpine
    container_name: securoxi-ingress-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - securoxi-bridge
    depends_on:
      - securoxi-api

  securoxi-postgres-db:
    image: postgres:16-alpine
    container_name: securoxi-postgres-db
    restart: always
    environment:
      POSTGRES_DB: securoxi
      POSTGRES_USER: securoxi
      POSTGRES_PASSWORD: securoxi_secure_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - securoxi-bridge

  securoxi-redis-broker:
    image: redis:7-alpine
    container_name: securoxi-redis-broker
    restart: always
    networks:
      - securoxi-bridge

  securoxi-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securoxi-api-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - SECUROXI_API_KEY=securoxi-enterprise-key
      - DATABASE_URL=sqlite:///app/data/securoxi.db
      - STORAGE_ROOT=/app/data/storage
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8000
      - AI_PROVIDER=mock
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    volumes:
      - securoxi-data:/app/data
    networks:
      - securoxi-bridge
    depends_on:
      - securoxi-postgres-db
      - securoxi-redis-broker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  securoxi-bridge:
    driver: bridge

volumes:
  postgres_data:
  securoxi-data:
    driver: local
