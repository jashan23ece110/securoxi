version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: securoxi-postgres
    restart: always
    environment:
      POSTGRES_DB: securoxi_prod
      POSTGRES_USER: securoxi_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - db_password
    networks:
      - securoxi-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securoxi_user -d securoxi_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  securoxi-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securoxi-api-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://securoxi_user@postgres:5432/securoxi_prod
      - STORAGE_ROOT=/app/data/storage
      - CORS_ALLOWED_ORIGINS=https://app.securoxi.ai,https://securoxi.ai
      - AI_PROVIDER=gemini
      - GEMINI_MODEL=gemini-2.5-flash
    secrets:
      - api_key
      - gemini_key
    volumes:
      - securoxi-prod-data:/app/data
    networks:
      - securoxi-internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  securoxi-internal:
    driver: bridge

volumes:
  pgdata:
  securoxi-prod-data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  api_key:
    file: ./secrets/api_key.txt
  gemini_key:
    file: ./secrets/gemini_key.txt
